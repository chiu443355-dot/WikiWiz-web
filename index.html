    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121824;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-primary: #ffffff;
            --text-secondary: #8f9cae;
            --border-color: #1f293d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation Matrix */
        #sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .brand-header {
            padding: 24px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-green);
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 12px;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--border-color);
            color: var(--text-primary);
            border-left: 4px solid var(--accent-green);
        }

        /* Main Content Container */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-primary);
        }

        /* Top Control Header */
        #control-header {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 40px;
            gap: 8px;
            background-color: var(--bg-secondary);
        }

        .lang-btn {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background-color: rgba(0, 230, 118, 0.05);
        }

        /* Content Display Window */
        #content-viewport {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .phase-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .phase-subtitle {
            font-size: 16px;
            color: var(--accent-green);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-block {
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .section-block h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--text-primary);
            border-left: 3px solid var(--accent-green);
            padding-left: 10px;
        }

        .section-block p, .section-block ul {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 12px;
        }

        .section-block ul {
            padding-left: 20px;
        }

        .section-block li {
            margin-bottom: 6px;
        }

        /* Gita Instruction Alert Box */
        .gita-callout {
            background-color: rgba(255, 152, 0, 0.05);
            border-left: 4px solid #ff9800;
            padding: 20px;
            border-radius: 4px;
            margin-top: 24px;
            margin-bottom: 24px;
        }

        .gita-title {
            color: #ff9800;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gita-verse {
            font-style: italic;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Chart Visualization Wrapper */
        .chart-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            margin: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
            align-self: flex-start;
        }

        svg {
            width: 100%;
            max-width: 600px;
            height: auto;
        }
    </style>
</head>

                                <h3>ਅਸਲ ਹਕੀਕਤ</h3>
                                <p>ਛੋਟੀਆਂ-ਮੋਟੀਆਂ "ਟ੍ਰੇਡਿੰਗ ਟ੍ਰਿਕਸ" ਦੇ ਪਿੱਛੇ ਭੱਜਣਾ ਬੰਦ ਕਰੋ। ਮਾਰਕੀਟ ਵਿੱਚ ਲੰਬੇ ਸਮੇਂ ਤੱਕ ਟਿਕੇ ਰਹਿਣ ਲਈ ਮੈਕਰੋ ਇਕਨਾਮਿਕਸ ਅਤੇ ਲਿਕਵਿਡਿਟੀ ਨੂੰ ਸਮਝਣਾ ਜ਼ਰੂਰੀ ਹੈ। ਨਵੇਂ ਲੋਕ ਤੁਰੰਤ ਫੇਲ ਹੁੰਦੇ ਹਨ ਕਿਉਂਕਿ ਉਹ ਬਿਨਾਂ ਰਿਸਕ ਮੈਨੇਜਮੈਂਟ ਦੇ ਸਿਰਫ ਕੈਂਡਲਸਟਿੱਕ ਪੈਟਰਨ ਦੇਖ ਕੇ ਟ੍ਰੇਡ ਕਰਦੇ ਹਨ।</p>
                            </div>
                        `
                    }
                ]
            },
            beng: {
                phases: [
                    {
                        id: "p0",
                        menuTitle: "ফেজ 0: ভিত্তি",
                        title: "ফেজ 0 — প্রাথমিক মানসিকতা",
                        subtitle: "প্রয়োজনীয় প্রাথমিক পর্যায় | ভিশন সেটআপ",
                        content: `
                            <div class="section-block">
                                <h3>আসল বাস্তবতা</h3>
                                <p>ছোটখাটো "ট্রেডিং ট্রিক্স" খোঁজা বন্ধ করুন। মার্কেটে টিকে থাকার জন্য ম্যাক্রো ইকোনমিক সিস্টেম এবং লিকুইডিটি মডেল বোঝা অত্যন্ত জরুরি। নতুনরা দ্রুত ব্যর্থ হয় কারণ তারা রিস্ক ম্যানেজমেন্ট না বুঝে শুধু ক্যান্ডেলস্টিক প্যাটার্ন দেখে ট্রেড করতে যায়।</p>
                            </div>
                        `
                    }
                ]
            }
        };

        // Fallback fallback handling framework for scale
        let globalState = {
            activeLanguage: 'eng',
            activePhaseId: 'p0'
        };

        function buildNavigationMatrix() {
            const navContainer = document.getElementById('nav-matrix');
            navContainer.innerHTML = '';
            
            // Revert securely to english dictionary schema mapping if regional strings are non-existent
            const activeDictionary = localizationEngine[globalState.activeLanguage] || localizationEngine['eng'];
            const fallbackDictionary = localizationEngine['eng'];
            
            fallbackDictionary.phases.forEach((basePhase, idx) => {
                const regionalPhase = activeDictionary.phases.find(p => p.id === basePhase.id) || basePhase;
                
                const li = document.createElement('li');
                li.className = `nav-item ${globalState.activePhaseId === basePhase.id ? 'active' : ''}`;
                li.innerText = regionalPhase.menuTitle || basePhase.menuTitle;
                li.setAttribute('onclick', `switchPhase('${basePhase.id}')`);
                navContainer.appendChild(li);
            });
        }

        function renderContentViewport() {
            const viewport = document.getElementById('content-viewport');
            const activeDictionary = localizationEngine[globalState.activeLanguage] || localizationEngine['eng'];
            const fallbackDictionary = localizationEngine['eng'];
            
            let targetPhase = activeDictionary.phases.find(p => p.id === globalState.activePhaseId);
            
            // Automated architectural fallback sequence to English for unpopulated expansion chapters
            if (!targetPhase) {
                targetPhase = fallbackDictionary.phases.find(p => p.id === globalState.activePhaseId);
            }

            viewport.innerHTML = `
                <h1 class="phase-title">${targetPhase.title}</h1>
                <div class="phase-subtitle">${targetPhase.subtitle}</div>
                <div>${targetPhase.content}</div>
            `;
        }

        function switchLanguage(langCode) {
            globalState.activeLanguage = langCode;
            
            // Adjust visual class states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(langCode)) {
                    btn.classList.add('active');
                }
            });

            buildNavigationMatrix();
            renderContentViewport();
        }

        function switchPhase(phaseId) {
            globalState.activePhaseId = phaseId;
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            buildNavigationMatrix();
            renderContentViewport();
        }

        // Initialize execution sequence on lifecycle boot
        window.onload = () => {
            buildNavigationMatrix();
            renderContentViewport();
        };
    </script>
</body>
</html>
